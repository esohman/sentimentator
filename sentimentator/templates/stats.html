<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EmoMap · Progress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/normalize.css') }}">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/skeleton.css') }}">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
<div class="container emomap-home">
  <h2>Progress</h2>
  {% if study %}<p><strong>{{ study.title }}</strong></p>{% endif %}
  <p>{{ username }}: {{ progress.completed }} / {{ progress.total }} submitted ({{ progress.percent }}%).</p>
  <div class="emomap-progress-track"><div class="emomap-progress-bar" style="width: {{ progress.percent }}%"></div></div>
  {% if not progress.finished %}<a href="{{ url_for('annotate') }}" class="button button-primary">RESUME</a>{% endif %}
  <a href="{{ url_for('index') }}" class="button">BACK</a>
</div>
</body>
</html>
